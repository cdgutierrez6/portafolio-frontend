sonar.projectKey=cdgutierrez6_portafolio-frontend
sonar.projectName=Portfolio Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src/__tests__
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Coverage report generated by: npx vitest run --coverage --coverage.reporter=lcov
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage scope: only src/lib (pure utility functions testable in isolation)
# Components, pages and hooks require Next.js/browser context — excluded from coverage
sonar.coverage.exclusions=src/app/**,src/components/**,src/data/**,src/hooks/**,src/app/globals.css,**/*.d.ts,src/middleware.ts
# Falso positivo (2026-07-31): el diccionario i18n de `types.ts` es un mapa bilingüe
# (es/en) inherentemente paralelo — CPD marca las llaves espejo como "duplicadas".
# No es código copiado: son traducciones. Se excluye SOLO de copy-paste detection.
sonar.cpd.exclusions=src/__tests__/**,src/lib/types.ts
sonar.test.inclusions=src/__tests__/**/*.test.ts,src/__tests__/**/*.test.tsx

# Falso positivo verificado (2026-07-29): S2245 marca Math.random() como "PRNG inseguro".
# En ParticleField.tsx se usa SOLO para posiciones/animacion visual de particulas del
# fondo 3D — nunca para seguridad, tokens ni criptografia. No es una vulnerabilidad.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=**/ParticleField.tsx
